<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no" />
        <link rel="preload" href="https://cdn.jsdelivr.net/npm/@perspective-dev/server/dist/wasm/perspective-server.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
        <link rel="preload" href="https://cdn.jsdelivr.net/npm/@perspective-dev/viewer/dist/wasm/perspective-viewer.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
        <link rel="preload" href="https://cdn.jsdelivr.net/npm/superstore-arrow/superstore.lz4.arrow" as="fetch" type="arraybuffer" crossorigin="anonymous" />
        <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/@perspective-dev/viewer/dist/css/themes.css" />
        <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/@perspective-dev/viewer/dist/css/intl/zh.css" />
        <script type="module">
            import "https://cdn.jsdelivr.net/npm/@perspective-dev/viewer@4.4.0/dist/cdn/perspective-viewer.js";
            import "https://cdn.jsdelivr.net/npm/@perspective-dev/viewer-datagrid@4.4.0/dist/cdn/perspective-viewer-datagrid.js";
            import "https://cdn.jsdelivr.net/npm/@perspective-dev/viewer-d3fc@4.4.0/dist/cdn/perspective-viewer-d3fc.js";

            import perspective from "https://cdn.jsdelivr.net/npm/@perspective-dev/client@4.4.0/dist/cdn/perspective.js";

            const worker = await perspective.worker();
            const resp = await fetch("https://cdn.jsdelivr.net/npm/superstore-arrow/superstore.lz4.arrow");
            const arrow = await resp.arrayBuffer();
            const viewer = document.getElementsByTagName("perspective-viewer")[0];
            await worker.table(arrow, { name: "superstore" });
            await viewer.load(worker);
            await viewer.restore({
                version: "4.3.0",
                columns_config: {},
                plugin: "Datagrid",
                plugin_config: {},
                settings: true,
                table: "superstore",
                theme: "Ticker Tape",
                title: null,
                group_by: ["Region", "State", "City"],
                split_by: ["Category", "Sub-Category"],
                sort: [],
                filter: [],
                group_rollup_mode: "rollup",
                expressions: {},
                columns: ["Sales", "Quantity", "Discount", "Profit"],
                aggregates: {},
            });
        </script>
        <style>
            perspective-viewer {
                position: absolute;
                top: 0;
                left: 0;
                bottom: 0;
                right: 0;
            }
        </style>
    </head>
    <body>
        <perspective-viewer></perspective-viewer>
    </body>
</html>

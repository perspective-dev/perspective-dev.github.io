<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no" />
        <link rel="preload" href="https://cdn.jsdelivr.net/npm/@perspective-dev/server@5.1.0/dist/wasm/perspective-server.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
        <link rel="preload" href="https://cdn.jsdelivr.net/npm/@perspective-dev/viewer@5.1.0/dist/wasm/perspective-viewer.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
        <link rel="preload" href="https://cdn.jsdelivr.net/npm/superstore-arrow@3.2.0/superstore.lz4.arrow" as="fetch" type="arraybuffer" crossorigin="anonymous" />
        <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/@perspective-dev/viewer@5.1.0/dist/css/themes.css" />
        <script type="module">
            import "https://cdn.jsdelivr.net/npm/@perspective-dev/viewer@5.1.0/dist/cdn/perspective-viewer.js";
            import "https://cdn.jsdelivr.net/npm/@perspective-dev/viewer-datagrid@5.1.0/dist/cdn/perspective-viewer-datagrid.js";
            import "https://cdn.jsdelivr.net/npm/@perspective-dev/viewer-charts@5.1.0/dist/cdn/perspective-viewer-charts.js";

            import perspective from "https://cdn.jsdelivr.net/npm/@perspective-dev/client@5.1.0/dist/cdn/perspective.js";

            const worker = await perspective.worker();
            const resp = await fetch("https://cdn.jsdelivr.net/npm/superstore-arrow@3.2.0/superstore.lz4.arrow");
            const arrow = await resp.arrayBuffer();
            const viewer = document.getElementsByTagName("perspective-viewer")[0];
            await worker.table(arrow, { name: "superstore" });
            await viewer.load(worker);
            await viewer.restore({ table: "superstore", settings: true, plugin_config: { edit_mode: "EDIT" } });
        </script>
        <style>
            perspective-viewer {
                position: absolute;
                top: 0;
                left: 0;
                bottom: 0;
                right: 0;
            }
        </style>
    </head>
    <body>
        <perspective-viewer></perspective-viewer>
    </body>
</html>

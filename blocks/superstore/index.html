<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no" />
        <link rel="preload" href="https://cdn.jsdelivr.net/npm/@perspective-dev/server/dist/wasm/perspective-server.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
        <link rel="preload" href="https://cdn.jsdelivr.net/npm/@perspective-dev/viewer/dist/wasm/perspective-viewer.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
        <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/@perspective-dev/viewer/dist/css/themes.css" />
        <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/@perspective-dev/workspace/dist/css/pro.css" />
        <style>
            perspective-workspace {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
            }

            body {
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <perspective-workspace id="workspace"></perspective-workspace>
        <script type="module">
            import "https://cdn.jsdelivr.net/npm/@perspective-dev/viewer@4.5.0/dist/cdn/perspective-viewer.js";
            import "https://cdn.jsdelivr.net/npm/@perspective-dev/workspace@4.5.0/dist/cdn/perspective-workspace.js";
            import "https://cdn.jsdelivr.net/npm/@perspective-dev/viewer-datagrid@4.5.0/dist/cdn/perspective-viewer-datagrid.js";
            import "https://cdn.jsdelivr.net/npm/@perspective-dev/viewer-charts@4.5.0/dist/cdn/perspective-viewer-charts.js";

            import perspective from "https://cdn.jsdelivr.net/npm/@perspective-dev/client@4.5.0/dist/cdn/perspective.js";

            const DATA_URL = "https://cdn.jsdelivr.net/npm/superstore-arrow/superstore.lz4.arrow";

            async function get_layout() {
                const req = await fetch("layout.json");
                const json = await req.json();
                return json;
            }

            const request = fetch(DATA_URL);
            const worker = await perspective.worker();
            const response = await request;
            const buffer = await response.arrayBuffer();
            await worker.table(buffer, { name: "superstore" });
            window.workspace.load(worker);
            const layout = await get_layout();
            await window.workspace.restore(layout);
        </script>
    </body>
</html>
